<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where's Qoin?</title>
  <style>
    :root {
      --sky: #bfe9ff;
      --grass: #7bd86f;
      --road: #4a4a4a;
      --road-line: #f8f8f8;
      --car: #ff4d4d;
      --car-dark: #c92f2f;
      --house: #ffd166;
      --roof: #ef476f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(#eef8ff, #ffffff);
      color: #222;
    }

    .page {
      width: min(1000px, 94vw);
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(1.8rem, 4vw, 3rem);
    }

    p {
      margin-top: 0;
      color: #555;
    }

    .scene {
      position: relative;
      height: 360px;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(var(--sky) 0 62%, var(--grass) 62% 100%);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.14);
      border: 4px solid #ffffff;
    }

    .sun {
      position: absolute;
      top: 35px;
      left: 50px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 35px rgba(255, 209, 102, 0.8);
    }

    .cloud {
      position: absolute;
      top: 60px;
      width: 110px;
      height: 38px;
      border-radius: 999px;
      background: #fff;
      opacity: 0.9;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    .cloud::before {
      width: 48px;
      height: 48px;
      left: 18px;
      top: -22px;
    }

    .cloud::after {
      width: 62px;
      height: 62px;
      right: 18px;
      top: -32px;
    }

    .cloud.one {
      right: 250px;
    }

    .cloud.two {
      top: 100px;
      right: 90px;
      transform: scale(0.75);
      opacity: 0.75;
    }

    .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 32px;
      height: 96px;
      background: var(--road);
      border-top: 7px solid #353535;
      border-bottom: 7px solid #353535;
    }

    .road::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 42px;
      height: 8px;
      background: repeating-linear-gradient(
        90deg,
        var(--road-line) 0 55px,
        transparent 55px 100px
      );
      opacity: 0.9;
    }

    .house {
      position: absolute;
      right: 65px;
      bottom: 125px;
      width: 150px;
      height: 115px;
      background: var(--house);
      border: 5px solid #8d6e3f;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      z-index: 4;
    }

    .house::before {
      content: "";
      position: absolute;
      left: -20px;
      top: -75px;
      width: 0;
      height: 0;
      border-left: 93px solid transparent;
      border-right: 93px solid transparent;
      border-bottom: 78px solid var(--roof);
      filter: drop-shadow(0 4px 0 #9c2544);
    }

    .door {
      position: absolute;
      bottom: 0;
      left: 58px;
      width: 38px;
      height: 62px;
      background: #7b4f2a;
      border-radius: 8px 8px 0 0;
    }

    .door::after {
      content: "";
      position: absolute;
      right: 7px;
      top: 32px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffd166;
    }

    .window {
      position: absolute;
      top: 28px;
      width: 34px;
      height: 30px;
      background: #85d7ff;
      border: 4px solid #fff;
    }

    .window.left {
      left: 22px;
    }

    .window.right {
      right: 22px;
    }

    .car-wrap {
      position: absolute;
      left: 30px;
      bottom: 94px;
      width: 130px;
      height: 72px;
      z-index: 5;
      transform: translateX(0);
    }

    .car {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 130px;
      height: 45px;
      background: var(--car);
      border-radius: 18px 28px 12px 12px;
      box-shadow: inset 0 -10px 0 var(--car-dark);
      animation: carBounce 0.55s ease-in-out infinite alternate;
    }

    .car::before {
      content: "";
      position: absolute;
      left: 28px;
      top: -26px;
      width: 62px;
      height: 35px;
      background: var(--car);
      border-radius: 24px 24px 0 0;
    }

    .windshield {
      position: absolute;
      left: 42px;
      top: -18px;
      width: 22px;
      height: 22px;
      background: #bfe9ff;
      border-radius: 10px 2px 2px 2px;
      z-index: 2;
    }

    .window-car {
      position: absolute;
      left: 68px;
      top: -18px;
      width: 24px;
      height: 22px;
      background: #bfe9ff;
      border-radius: 2px 10px 2px 2px;
      z-index: 2;
    }

    .wheel {
      position: absolute;
      bottom: -8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #202020;
      border: 6px solid #777;
      animation: spin 0.7s linear infinite;
    }

    .wheel.front {
      right: 18px;
    }

    .wheel.back {
      left: 18px;
    }

    .progress-shell {
      margin: 24px auto 12px;
      width: min(720px, 92vw);
      height: 24px;
      background: #e6e6e6;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      border-radius: inherit;
    }

    @keyframes carBounce {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      font-weight: bold;
      min-height: 24px;
      margin-top: 10px;
    }

    .admin-login,
    .admin-panel {
      margin-top: 18px;
      display: none;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .admin-login {
      display: flex;
    }

    .admin-login input {
      padding: 11px 14px;
      border: 1px solid #ccc;
      border-radius: 999px;
      font-size: 1rem;
      min-width: 220px;
    }

    .admin-button {
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      box-shadow: 0 8px 18px rgba(0,0,0,0.16);
    }

    .admin-button:hover {
      background: #444;
    }

    .admin-button.secondary {
      background: #555;
    }

    .admin-button.danger {
      background: #b3261e;
    }

    .admin-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .admin-message {
      width: 100%;
      font-size: 0.9rem;
      color: #666;
      min-height: 20px;
    }

    @media (max-width: 650px) {
      .scene {
        height: 300px;
      }

      .house {
        transform: scale(0.75);
        transform-origin: bottom right;
        right: 28px;
      }

      .car-wrap {
        width: 105px;
      }

      .car {
        transform-origin: bottom left;
        scale: 0.78;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Where's Qoin?</h1>
    <p>The car moves toward the house like a shared loading bar.</p>

    <section class="scene" id="scene">
      <div class="sun"></div>
      <div class="cloud one"></div>
      <div class="cloud two"></div>

      <div class="house" id="house" aria-label="house">
        <div class="window left"></div>
        <div class="window right"></div>
        <div class="door"></div>
      </div>

      <div class="road"></div>

      <div class="car-wrap" id="carWrap" aria-label="moving car">
        <div class="car">
          <div class="windshield"></div>
          <div class="window-car"></div>
          <div class="wheel back"></div>
          <div class="wheel front"></div>
        </div>
      </div>
    </section>

    <div class="progress-shell">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="status" id="status">Waiting to start...</div>

    <div class="admin-login" id="adminLogin">
      <input id="adminEmail" type="email" placeholder="Admin email" autocomplete="username" />
      <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password" />
      <button class="admin-button" id="loginButton">Admin Login</button>
      <div class="admin-message" id="adminMessage"></div>
    </div>

    <div class="admin-panel" id="adminPanel">
      <button class="admin-button" id="startButton">Start</button>
      <button class="admin-button secondary" id="finishButton">Finish</button>
      <button class="admin-button danger" id="resetButton">Reset</button>
      <button class="admin-button secondary" id="logoutButton">Logout</button>
      <div class="admin-message" id="adminStatus"></div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      runTransaction,
      set,
      remove
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAS89nLEywPcaAaquVVYD5Y7e3-iTV2uPo",
      authDomain: "where-s-qoin.firebaseapp.com",
      databaseURL: "https://where-s-qoin-default-rtdb.firebaseio.com",
      projectId: "where-s-qoin",
      storageBucket: "where-s-qoin.firebasestorage.app",
      messagingSenderId: "770113955571",
      appId: "1:770113955571:web:2c6706ce3798dca514b986"
    };

    /*
      Change this number to control the shared loading duration.
      600 = 10 minutes
      3600 = 1 hour
      86400 = 24 hours
    */
    const LOADING_DURATION_SECONDS = 600;
    const ADMIN_UID = "SDfoy6k5vfMTVrjOXL08JWLCPmn1";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const progressRef = ref(db, "qoinProgress");
    const offsetRef = ref(db, ".info/serverTimeOffset");

    const scene = document.getElementById("scene");
    const house = document.getElementById("house");
    const car = document.getElementById("carWrap");
    const fill = document.getElementById("progressFill");
    const statusText = document.getElementById("status");

    const adminLogin = document.getElementById("adminLogin");
    const adminPanel = document.getElementById("adminPanel");
    const adminEmail = document.getElementById("adminEmail");
    const adminPassword = document.getElementById("adminPassword");
    const loginButton = document.getElementById("loginButton");
    const logoutButton = document.getElementById("logoutButton");
    const startButton = document.getElementById("startButton");
    const finishButton = document.getElementById("finishButton");
    const resetButton = document.getElementById("resetButton");
    const adminMessage = document.getElementById("adminMessage");
    const adminStatus = document.getElementById("adminStatus");

    let serverTimeOffset = 0;
    let startedAt = null;
    let animationFrameId = null;

    onValue(offsetRef, (snapshot) => {
      serverTimeOffset = snapshot.val() || 0;
    });

    function serverNow() {
      return Date.now() + serverTimeOffset;
    }

    function getTravelDistance() {
      const sceneRect = scene.getBoundingClientRect();
      const houseRect = house.getBoundingClientRect();
      const carRect = car.getBoundingClientRect();
      const stopGap = 24;

      return Math.max(
        0,
        houseRect.left - sceneRect.left - carRect.width - stopGap
      );
    }

    function variedProgress(t) {
      const points = [
        [0.00, 0.00],
        [0.08, 0.04],
        [0.18, 0.10],
        [0.28, 0.28],
        [0.42, 0.38],
        [0.55, 0.61],
        [0.68, 0.70],
        [0.82, 0.88],
        [0.94, 0.96],
        [1.00, 1.00]
      ];

      for (let i = 0; i < points.length - 1; i++) {
        const [timeA, valueA] = points[i];
        const [timeB, valueB] = points[i + 1];

        if (t >= timeA && t <= timeB) {
          const localT = (t - timeA) / (timeB - timeA);
          const smoothed = localT * localT * (3 - 2 * localT);
          return valueA + (valueB - valueA) * smoothed;
        }
      }

      return 1;
    }

    function updateVisuals(rawProgress) {
      const clamped = Math.min(Math.max(rawProgress, 0), 1);
      const visualProgress = variedProgress(clamped);
      const travelDistance = getTravelDistance();

      const x = travelDistance * visualProgress;
      const bump = Math.sin(visualProgress * Math.PI * 18) * 1.5;
      const tilt = Math.sin(visualProgress * Math.PI * 10) * 0.5;

      car.style.transform = `translateX(${x}px) translateY(${bump}px) rotate(${tilt}deg)`;
      fill.style.width = `${visualProgress * 100}%`;
    }

    function formatEta(startTime) {
      const etaTime = new Date(startTime + LOADING_DURATION_SECONDS * 1000);

      return etaTime.toLocaleTimeString("en-US", {
        timeZone: "America/New_York",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      });
    }

    function startSharedAnimation() {
      cancelAnimationFrame(animationFrameId);

      function frame() {
        if (!startedAt) return;

        const elapsedSeconds = (serverNow() - startedAt) / 1000;
        const rawProgress = elapsedSeconds / LOADING_DURATION_SECONDS;

        updateVisuals(rawProgress);

        if (rawProgress >= 1) {
          statusText.textContent = "Arrived!";
          updateVisuals(1);
          return;
        }

        statusText.textContent = `ETA: ${formatEta(startedAt)}`;
        animationFrameId = requestAnimationFrame(frame);
      }

      frame();
    }

    loginButton.addEventListener("click", async () => {
      adminMessage.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {
        await signInWithEmailAndPassword(auth, adminEmail.value, adminPassword.value);
        adminPassword.value = "";
      } catch (error) {
        adminMessage.textContent = "Login failed. Check the email/password.";
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Admin Login";
      }
    });

    logoutButton.addEventListener("click", async () => {
      await signOut(auth);
    });

    startButton.addEventListener("click", async () => {
      adminStatus.textContent = "";
      startButton.disabled = true;
      startButton.textContent = "Starting...";

      try {
        await runTransaction(progressRef, (currentValue) => {
          if (currentValue && currentValue.startedAt) {
            return currentValue;
          }

          return {
            startedAt: serverNow(),
            finishedAt: null
          };
        });
        adminStatus.textContent = "Started.";
      } catch (error) {
        adminStatus.textContent = "Start failed. Check Firebase rules.";
      } finally {
        startButton.disabled = false;
        startButton.textContent = "Start";
      }
    });

    finishButton.addEventListener("click", async () => {
      adminStatus.textContent = "";

      try {
        await set(progressRef, {
          startedAt: serverNow() - LOADING_DURATION_SECONDS * 1000,
          finishedAt: serverNow()
        });
        adminStatus.textContent = "Finished.";
      } catch (error) {
        adminStatus.textContent = "Finish failed. Check Firebase rules.";
      }
    });

    resetButton.addEventListener("click", async () => {
      adminStatus.textContent = "";

      try {
        await remove(progressRef);
        adminStatus.textContent = "Reset.";
      } catch (error) {
        adminStatus.textContent = "Reset failed. Check Firebase rules.";
      }
    });

    onAuthStateChanged(auth, (user) => {
      const isAdmin = user && user.uid === ADMIN_UID;

      adminLogin.style.display = isAdmin ? "none" : "flex";
      adminPanel.style.display = isAdmin ? "flex" : "none";

      if (user && !isAdmin) {
        adminMessage.textContent = "You are signed in, but this account is not an admin.";
      } else {
        adminMessage.textContent = "";
      }
    });

    onValue(progressRef, (snapshot) => {
      const data = snapshot.val();

      if (!data || !data.startedAt) {
        startedAt = null;
        statusText.textContent = "Waiting to start...";
        updateVisuals(0);
        return;
      }

      startedAt = data.startedAt;
      startSharedAnimation();
    });

    window.addEventListener("resize", () => {
      if (startedAt) {
        const elapsedSeconds = (serverNow() - startedAt) / 1000;
        updateVisuals(elapsedSeconds / LOADING_DURATION_SECONDS);
      }
    });
  </script>
</body>
</html>
